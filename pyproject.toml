[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nds-forge"
version = "0.1.0"
description = "Extensible, provenance-first OSM to Neusoft map build pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
osm = ["osmium>=4,<5", "shapely>=2,<3"]
container = ["cryptography>=42,<47"]
full = ["osmium>=4,<5", "shapely>=2,<3", "cryptography>=42,<47"]
test = ["jsonschema>=4.22,<5"]
quality = ["coverage>=7.6,<8", "mypy>=1.13,<2", "ruff>=0.9,<1"]

[project.scripts]
nds-forge = "nds_forge.cli:main"

[tool.setuptools.packages.find]
include = ["nds_forge*"]
