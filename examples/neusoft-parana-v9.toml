schema_version = 1
project_id = "neusoft-parana-v9-local"
workspace = "./work/neusoft-parana-v9"

[region]
id = "parana-state"
name = "Paraná experimental (bbox; atribuição municipal pendente)"
source = "bbox"
bbox = [-54.62, -26.72, -48.02, -22.51]

[source]
kind = "pbf"
path = "./work/neusoft-curitiba-v9/inputs/curitiba-v9-inputs/parana-latest.osm.pbf"
sha256 = "cc2f1f5aa4b46378969fce2274a14bb4c3f2e2f8bbf63f280086fc231580d885"
license = "ODbL-1.0"
attribution = "© OpenStreetMap contributors"

[pipeline]
target = "container.pack"
enable_experimental = true

[neusoft]
profile_id = "neusoft-curitiba-v9"
bootstrap_dir = "./work/neusoft-curitiba-v9/inputs/israel-original-base-v1.0.0"

[neusoft.container_keys]
"db/NAV/UR439/BMD.NDS" = "env:NDS_KEY_BMD"
"db/NAV/UR439/NAME.NDS" = "env:NDS_KEY_NAME"
"db/NAV/UR439/FTS.NDS" = "env:NDS_KEY_FTS"
"db/NAV/UR439/POI.NDS" = "env:NDS_KEY_POI"
"db/NAV/UR439/ROUTE.NDS" = "env:NDS_KEY_ROUTE"
"db/NAV/UR439/SHARED.NDS" = "env:NDS_KEY_SHARED"

[neusoft.grid]
route_level = 13
route_shift = 4

[neusoft.grid.bmd]
level = 11
shift = 4

[neusoft.index_levels]
route = 9

[neusoft.names]
# Fallback honesto: não associa ruas estaduais a Curitiba nem inventa CEP.
# Município por rua exige spatial join com polígonos administrativos OSM.
admin_scope = "state"
locale = "pt-BR"
region_id = 439
street_class = 11
alias_policy = { include_unaccented = true, prefixes = ["Rua ", "Avenida ", "Alameda ", "Travessa ", "Largo ", "Praça ", "Galeria ", "Praca ", "Av ", "Av. ", "R. ", "Al. ", "Tv. "] }
admin_hierarchy = [
  { id = 1, name = "Brasil", class = 0, morton = -331110206186328949 },
  { id = 2, name = "Paraná", class = 2, morton = -437576311485569377 },
]
criterion_a = '\ue1651'
criterion_b = '\ue1661'
criterion_c = ""
criterion_d = ""
criterion_j = ""
admin_substitutions = ["Brasil Brazil BR", "Paraná Parana PR"]

[neusoft.road_policy]
default_frc = 4
excluded_highways = ["footway", "steps", "corridor", "platform", "path", "bus_stop", "cycleway"]
frc_by_highway = { motorway = 0, motorway_link = 0, trunk = 1, trunk_link = 1, primary = 1, primary_link = 1, secondary = 2, secondary_link = 2, tertiary = 3, tertiary_link = 3, residential = 4, living_street = 4, busway = 4, unclassified = 5, service = 5, pedestrian = 6 }

[neusoft.poi]
region_id = 439
# Conservative native taxonomy: full FTS paths and integer POI IDs observed in
# pinned Israel seed joins. See docs/poi-native-categories.md for evidence/limits.
# Multiple-membership/subtype categories are deliberately excluded.
source = "osm"
native_category_profile = "neusoft-israel-poi-single-membership-v1"
native_category_profile_sha256 = "fcfe4deaafea68b722816c82b6f8e9ed11b8dbaeebe885ca1a32e0e9a8fcccbe"

