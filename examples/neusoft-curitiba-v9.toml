schema_version = 1
project_id = "neusoft-curitiba-v9-local"
workspace = "./work/neusoft-curitiba-v9"

[region]
id = "curitiba-profile-input"
name = "Curitiba (profile de compatibilidade explícito)"
source = "boundary_geojson"
boundary_geojson = "./work/neusoft-curitiba-v9/inputs/curitiba-v9-inputs/curitiba-boundary.geojson"
osm_relation_id = 297514

[source]
kind = "pbf"
path = "./work/neusoft-curitiba-v9/inputs/curitiba-v9-inputs/parana-latest.osm.pbf"
sha256 = "cc2f1f5aa4b46378969fce2274a14bb4c3f2e2f8bbf63f280086fc231580d885"
license = "ODbL-1.0"
attribution = "© OpenStreetMap contributors"

[pipeline]
target = "container.pack"
enable_experimental = true

[[downloads.bundles]]
id = "israel-original-base-v1.0.0"
url = "https://github.com/Timoteohss/neusoft-nds-forge/releases/download/nds-israel-base-v1.0.0/neusoft-israel-original-base-v1.tar.gz"
sha256 = "0b564acdd834087753d8e1b7f17cdfa737015d9a0b073c4f6af8378b2019445b"
destination = "./work/neusoft-curitiba-v9/inputs/israel-original-base-v1.0.0"

[[downloads.bundles]]
id = "curitiba-v9-inputs-v1.0.1"
url = "https://github.com/Timoteohss/neusoft-nds-forge/releases/download/nds-curitiba-v9-inputs-v1.0.1/neusoft-curitiba-v9-inputs-v1.tar.gz"
sha256 = "4436e697b45335a7c41b91ac1ebc062c957f0e6c75630495101ab389cff6c877"
destination = "./work/neusoft-curitiba-v9/inputs/curitiba-v9-inputs"

[neusoft]
profile_id = "neusoft-curitiba-v9"
bootstrap_dir = "./work/neusoft-curitiba-v9/inputs/israel-original-base-v1.0.0"
# Resolvidas somente no runtime como secrets do ambiente; nunca grave valores.
[neusoft.container_keys]
"db/NAV/UR439/BMD.NDS" = "env:NDS_KEY_BMD"
"db/NAV/UR439/NAME.NDS" = "env:NDS_KEY_NAME"
"db/NAV/UR439/FTS.NDS" = "env:NDS_KEY_FTS"
"db/NAV/UR439/POI.NDS" = "env:NDS_KEY_POI"
"db/NAV/UR439/ROUTE.NDS" = "env:NDS_KEY_ROUTE"
"db/NAV/UR439/SHARED.NDS" = "env:NDS_KEY_SHARED"

[neusoft.grid]
route_level = 13
route_shift = 4

[neusoft.grid.bmd]
level = 11
shift = 4

[neusoft.index_levels]
route = 9

[neusoft.names]
locale = "pt-BR"
region_id = 439
street_class = 11
alias_policy = { include_unaccented = true, prefixes = ["Rua ", "Avenida ", "Alameda ", "Travessa ", "Largo ", "Praça ", "Galeria ", "Praca ", "Av ", "Av. ", "R. ", "Al. ", "Tv. "] }
admin_hierarchy = [
  { id = 1, name = "Brasil", class = 0, morton = -436007366425543595 },
  { id = 2, name = "Paraná", class = 2, morton = -436007366425543595 },
  { id = 3, name = "Curitiba", class = 9, morton = -436007366425543595 },
  { id = 4, name = "Curitiba", class = 10, morton = -436007366425543595 },
]
criterion_a = '\ue1651'
criterion_b = '\ue1661'
criterion_c = '\ue1671'
criterion_d = "Curitiba"
criterion_j = "80020"
admin_substitutions = ["Brasil Brazil BR", "Paraná Parana PR", "Curitiba CWB", "Curitiba Centro"]

[neusoft.road_policy]
default_frc = 4
excluded_highways = ["footway", "steps", "corridor", "platform", "path", "bus_stop", "cycleway"]
frc_by_highway = { motorway = 0, motorway_link = 0, trunk = 1, trunk_link = 1, primary = 1, primary_link = 1, secondary = 2, secondary_link = 2, tertiary = 3, tertiary_link = 3, residential = 4, living_street = 4, busway = 4, unclassified = 5, service = 5, pedestrian = 6 }

[neusoft.poi]
region_id = 439
source = "profile_curated"
curated_poi_file = "./work/neusoft-curitiba-v9/inputs/curitiba-v9-inputs/curated-pois.json"
poi_categories = { "\uE0001006" = "\uE0001006" }
poi_table_category_ids = { "\uE0001006" = 1006 }

[neusoft.route]
region_id = 439
simplify_tolerance_degrees = 0.000025
driveable_highways = ["motorway", "motorway_link", "trunk", "trunk_link", "primary", "primary_link", "secondary", "secondary_link", "tertiary", "tertiary_link", "unclassified", "residential", "living_street", "service"]
denied_access_values = ["no", "private", "agricultural", "forestry", "emergency"]
frc_by_highway = { motorway = 0, trunk = 1, primary = 1, secondary = 2, tertiary = 3, residential = 4, living_street = 4, unclassified = 5, service = 5 }
fallback_speed_kmh = { motorway = 80, trunk = 60, primary = 50, secondary = 40, tertiary = 30, residential = 30, living_street = 10, unclassified = 30, service = 10 }
